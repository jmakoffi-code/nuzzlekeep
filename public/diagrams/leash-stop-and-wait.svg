<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', monospace">
  <rect width="640" height="300" fill="#F8F3E5"/>

  <!-- Tight leash scenario -->
  <g transform="translate(40,50)">
    <text x="110" y="-15" text-anchor="middle" font-size="13" fill="#B5502E" font-weight="700" letter-spacing="1">TIGHT LEASH = STOP</text>
    <!-- owner -->
    <circle cx="20" cy="90" r="12" fill="#22301F"/>
    <rect x="12" y="102" width="16" height="40" fill="#22301F"/>
    <!-- dog -->
    <ellipse cx="180" cy="120" rx="26" ry="14" fill="#C89B3C"/>
    <circle cx="204" cy="112" r="10" fill="#C89B3C"/>
    <!-- taut leash -->
    <line x1="28" y1="95" x2="172" y2="118" stroke="#B5502E" stroke-width="3"/>
    <text x="100" y="100" text-anchor="middle" font-size="9" fill="#B5502E" font-weight="600">taut</text>
    <!-- feet planted -->
    <line x1="14" y1="142" x2="14" y2="150" stroke="#22301F" stroke-width="3"/>
    <line x1="26" y1="142" x2="26" y2="150" stroke="#22301F" stroke-width="3"/>
    <text x="110" y="172" text-anchor="middle" font-size="10" fill="#22301F">Owner stops walking. Waits.</text>
    <text x="110" y="187" text-anchor="middle" font-size="10" fill="#22301F">No forward motion.</text>
  </g>

  <!-- Arrow -->
  <path d="M300,130 L340,130" stroke="#22301F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22301F"/>
    </marker>
  </defs>

  <!-- Loose leash scenario -->
  <g transform="translate(380,50)">
    <text x="110" y="-15" text-anchor="middle" font-size="13" fill="#5C6B5E" font-weight="700" letter-spacing="1">LOOSE LEASH = WALK</text>
    <!-- owner -->
    <circle cx="20" cy="90" r="12" fill="#22301F"/>
    <rect x="12" y="102" width="16" height="40" fill="#22301F"/>
    <!-- dog beside -->
    <ellipse cx="90" cy="110" rx="24" ry="13" fill="#C89B3C"/>
    <circle cx="112" cy="103" r="9" fill="#C89B3C"/>
    <!-- slack leash -->
    <path d="M28,95 Q60,115 84,108" fill="none" stroke="#5C6B5E" stroke-width="3"/>
    <text x="55" y="130" text-anchor="middle" font-size="9" fill="#5C6B5E" font-weight="600">slack</text>
    <text x="110" y="172" text-anchor="middle" font-size="10" fill="#22301F">Walk continues the moment</text>
    <text x="110" y="187" text-anchor="middle" font-size="10" fill="#22301F">the leash loosens.</text>
  </g>

  <rect x="15" y="15" width="610" height="260" fill="none" stroke="#22301F" stroke-width="1.5"/>
</svg>

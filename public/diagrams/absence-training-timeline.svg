<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', monospace">
  <rect width="700" height="260" fill="#F8F3E5"/>

  <text x="350" y="40" text-anchor="middle" font-size="13" fill="#22301F" font-weight="700" letter-spacing="1">BUILD ABSENCE TIME GRADUALLY</text>

  <!-- timeline base -->
  <line x1="60" y1="180" x2="640" y2="180" stroke="#22301F" stroke-width="2"/>

  <!-- step markers -->
  <g font-size="10">
    <circle cx="90" cy="180" r="6" fill="#C89B3C"/>
    <text x="90" y="205" text-anchor="middle" fill="#22301F" font-weight="700">2-3 min</text>
    <text x="90" y="220" text-anchor="middle" fill="#5C6B5E">week 1</text>

    <circle cx="230" cy="180" r="6" fill="#C89B3C"/>
    <text x="230" y="205" text-anchor="middle" fill="#22301F" font-weight="700">15-20 min</text>
    <text x="230" y="220" text-anchor="middle" fill="#5C6B5E">week 2</text>

    <circle cx="380" cy="180" r="6" fill="#C89B3C"/>
    <text x="380" y="205" text-anchor="middle" fill="#22301F" font-weight="700">1 hour</text>
    <text x="380" y="220" text-anchor="middle" fill="#5C6B5E">week 3-4</text>

    <circle cx="530" cy="180" r="6" fill="#B5502E"/>
    <text x="530" y="205" text-anchor="middle" fill="#22301F" font-weight="700">Half day</text>
    <text x="530" y="220" text-anchor="middle" fill="#5C6B5E">week 5-6</text>

    <circle cx="620" cy="180" r="6" fill="#5C6B5E"/>
    <text x="620" y="205" text-anchor="middle" fill="#22301F" font-weight="700">Full day</text>
    <text x="620" y="220" text-anchor="middle" fill="#5C6B5E">week 6-8+</text>
  </g>

  <!-- bars showing increasing height = increasing duration -->
  <rect x="85" y="150" width="10" height="30" fill="#C89B3C" opacity="0.6"/>
  <rect x="225" y="120" width="10" height="60" fill="#C89B3C" opacity="0.6"/>
  <rect x="375" y="95" width="10" height="85" fill="#C89B3C" opacity="0.75"/>
  <rect x="525" y="70" width="10" height="110" fill="#B5502E" opacity="0.75"/>
  <rect x="615" y="55" width="10" height="125" fill="#5C6B5E" opacity="0.75"/>

  <text x="350" y="258" text-anchor="middle" font-size="10" fill="#5C6B5E">Only increase duration once your dog is calm at the current length</text>

  <rect x="15" y="15" width="670" height="250" fill="none" stroke="#22301F" stroke-width="1.5"/>
</svg>

<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', monospace">
  <rect width="640" height="260" fill="#F8F3E5"/>

  <text x="320" y="40" text-anchor="middle" font-size="13" fill="#22301F" font-weight="700" letter-spacing="1">BOX LENGTH = 1.5x YOUR CAT</text>

  <!-- cat silhouette (reference) -->
  <g transform="translate(60,90)">
    <ellipse cx="60" cy="40" rx="55" ry="18" fill="#C89B3C"/>
    <circle cx="112" cy="28" r="14" fill="#C89B3C"/>
    <path d="M8,40 Q-15,20 -5,0" fill="none" stroke="#C89B3C" stroke-width="6" stroke-linecap="round"/>
    <line x1="5" y1="58" x2="5" y2="72" stroke="#22301F" stroke-width="3"/>
    <line x1="115" y1="58" x2="115" y2="72" stroke="#22301F" stroke-width="3"/>
  </g>
  <line x1="55" y1="180" x2="177" y2="180" stroke="#B5502E" stroke-width="1.5"/>
  <text x="116" y="197" text-anchor="middle" font-size="9" fill="#B5502E" font-weight="600">cat, nose to base of tail</text>

  <!-- multiplication -->
  <text x="230" y="150" text-anchor="middle" font-size="20" fill="#22301F" font-weight="700">×1.5</text>

  <!-- litter box (correct size) -->
  <g transform="translate(290,110)">
    <rect x="0" y="0" width="260" height="70" fill="none" stroke="#22301F" stroke-width="3"/>
    <ellipse cx="90" cy="35" rx="45" ry="14" fill="#E9E1CC" stroke="#5C6B5E" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <line x1="290" y1="200" x2="550" y2="200" stroke="#B5502E" stroke-width="1.5"/>
  <text x="420" y="217" text-anchor="middle" font-size="9" fill="#B5502E" font-weight="600">litter box, correct length</text>

  <text x="320" y="240" text-anchor="middle" font-size="10" fill="#5C6B5E">Most store-bought boxes are sized for a much smaller cat than yours</text>

  <rect x="15" y="15" width="610" height="235" fill="none" stroke="#22301F" stroke-width="1.5"/>
</svg>
